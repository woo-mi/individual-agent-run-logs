<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Agent Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
<style>
  :root {
    --color-fg: #171717;
    --color-line: #E6E6E6;
    --green: #B9E95A;
    --red: #FF777A;
    --dot-gray: #DDDDDD;
    --dot-dim: #F3F3F3;
    --dim: #DDDDDD;
    --muted: #5C5C5E;
    --cell-fg: #2F2F31;
    --icon-gray: #6E6E74;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; min-height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-synthesis: none;
  }
  .frame {
    position: relative;
    min-height: 100vh;
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }
  .main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    margin-left: 48px;
    display: flex;
    flex-direction: column;
  }
  .content {
    width: 100%;
    max-width: 1162px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 1258px) {
    .content { padding: 0; }
  }

  /* ---------- Nav rail ---------- */
  .rail {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 10;
    width: 48px;
    background: rgba(245,245,245,0.82);
    backdrop-filter: blur(14px);
    border-right: 1px solid #E6E6E6;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  .rail-logo { width: 40px; height: 40px; margin-top: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-list { margin-top: 11px; width: 48px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .rail-item { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-item.active { background: #E6E6E6; }
  .rail-divider { width: 28px; height: 1px; margin-top: 5px; background: rgba(15,17,40,0.08); flex-shrink: 0; }
  .rail-search { margin-top: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-spacer { flex: 1; }
  .rail-bell { width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bell-wrap { position: relative; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .bell-badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 15px; height: 15px; padding: 0 3px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; background: #F04438; border: 2px solid #FFFFFF;
    font-size: 9px; line-height: 1; font-weight: 600; color: #FFFFFF;
  }
  .rail-avatar { width: 40px; height: 36px; margin-top: 4px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rail-avatar .circle {
    width: 20px; height: 20px; border-radius: 50%;
    background: #FBE6F5; border: 1px solid #E7B8DE;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 16px; font-weight: 600; color: #9E168E;
    font-family: system-ui, sans-serif;
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky; top: 0; z-index: 5;
    height: 48px; flex-shrink: 0;
    background: #FFFFFF; border-bottom: 1px solid #E6E6E6;
    display: flex; align-items: center; justify-content: space-between;
    padding-left: 12px; padding-right: 20px;
  }
  .header .crumb { display: flex; align-items: center; gap: 8px; }
  .header .crumb .icon20 { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 6px; flex-shrink: 0; }
  .header .crumb .label { font-size: 14px; line-height: 20px; color: #171717; font-family: system-ui, sans-serif; }

  /* ---------- Tabs row ---------- */
  .toolbar {
    margin-top: 39px;
    min-height: 33px;
    flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .tabs { display: flex; align-items: center; overflow: hidden; }
  .tab {
    height: 32px; min-width: 28px; max-width: 200px; padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9999px; position: relative;
    border: 0.5px solid transparent;
  }
  .tab.active { background: #ECECED; }
  .tab.active::before {
    content: ""; position: absolute; inset: 0; border-radius: 9999px;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.09);
  }
  .tab .inner { display: flex; align-items: flex-start; gap: 4px; position: relative; }
  .tab .label { font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5C5E; white-space: nowrap; }
  .tab.active .label { color: #1B1B1B; }
  .tab .mini-avatar {
    width: 16px; height: 16px; border-radius: 50%; position: relative; flex-shrink: 0;
    background: rgba(29,29,31,0.08); border: 1px solid rgba(29,29,31,0.28);
  }
  .tab .mini-avatar span {
    position: absolute; left: 3px; top: 1px;
    font-size: 9px; line-height: 12px; font-weight: 600; color: #1D1D1F;
    font-family: system-ui, sans-serif; text-align: center;
  }

  /* ---------- All Agent Runs page (frame "All Agents runs - default") ---------- */
  a.tab { text-decoration: none; cursor: pointer; }
  .acontent {
    width: 100%;
    max-width: 909px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 1005px) {
    .acontent { padding: 0; }
  }
  .afilters {
    margin-top: 33px;
    flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .afilters .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .failed-chip {
    height: 32px; padding: 0 12px 0 16px; border-radius: 100px;
    background: #FFFFFF; border: none; outline: 1px solid #F3B4B4; outline-offset: -1px;
    display: flex; align-items: center; gap: 6px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px; line-height: 16px; font-weight: 500; color: #C40C0C;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .failed-chip:hover { background: #FFFAFA; }
  .failed-chip .sq { width: 6px; height: 6px; border-radius: 3px; background: #E90E0E; flex-shrink: 0; }
  .filter-pill {
    height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid #E6E6E6; background: #FFFFFF;
    display: flex; align-items: center; gap: 6px;
    font-family: system-ui, sans-serif;
    font-size: 14px; line-height: 18px; color: #4D4D4D;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .filter-pill:hover { background: #FAFAFA; }
  .refresh-btn {
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
    background: #FFFFFF; border: none; outline: 1px solid #E6E6E6;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .refresh-btn:hover { background: #FAFAFA; }

  /* Run cards */
  .aruns { margin-top: 32px; flex-shrink: 0; }
  .arun { margin-bottom: 56px; }
  .arun-title {
    font-size: 18px; line-height: 22px;
    font-weight: 550; font-variation-settings: 'wght' 550, 'opsz' 28;
    color: #1B1B1B;
  }
  .arun-name {
    margin-top: 7px;
    font-size: 15px; line-height: 24px; letter-spacing: -0.1px;
    font-weight: 450; font-variation-settings: 'wght' 450;
    color: #5C5C5E;
  }
  .arun-meta {
    margin-top: 11px;
    position: relative;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    min-height: 16px;
  }
  .arun-chevron { position: absolute; left: -26px; top: 0; width: 16px; height: 16px; }
  .m-issues { display: flex; align-items: flex-start; gap: 8px; }
  .m-issues .label { font-size: 13px; line-height: 16px; font-weight: 450; font-variation-settings: 'wght' 450; color: #C40C0C; white-space: nowrap; }
  .m-dot { font-size: 13px; line-height: 16px; font-weight: 450; font-variation-settings: 'wght' 450; color: #5C5C5E; }
  .m-dur { display: flex; align-items: flex-start; gap: 4px; }
  .m-dur .label { font-size: 13px; line-height: 16px; font-weight: 450; font-variation-settings: 'wght' 450; color: #5C5C5E; white-space: nowrap; }
  .m-steps { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .m-step { display: flex; align-items: center; gap: 4px; }
  .m-step .label { font-size: 12px; line-height: 130%; letter-spacing: 0.12px; color: #5C5C5E; white-space: nowrap; }
  .m-step svg { flex-shrink: 0; }

  /* ---------- Expanded run card (frame "All Agents runs - default - open") ---------- */
  .arun-head { cursor: pointer; }
  .arun-chevron { transition: transform 200ms ease; }
  .arun.open .arun-chevron { transform: rotate(90deg); }
  .adetail {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 240ms ease;
  }
  .arun.open .adetail { grid-template-rows: 1fr; }
  .adetail-clip { overflow: hidden; min-height: 0; }
  .adetail-inner {
    display: flex; flex-direction: column; gap: 17px;
    padding-top: 14px;
  }
  .aline { height: 0.5px; background: #E6E6E6; }
  .aev { display: flex; align-items: flex-start; gap: 8px; }
  .aev .erail { width: 12px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .aev .dotbox { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .aev .dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
  .aev .dot.ok { background: #73A20D; }
  .aev .dot.fail { background: #E90E0E; }
  .aev .connector { width: 0.5px; height: 40px; flex-shrink: 0; background: #9B9B9B; }
  .aev .ebody { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding-top: 2px; }
  .aev .etime {
    min-width: 76px; flex-shrink: 0;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px; line-height: 16px; color: #777777;
  }
  .aev .emain { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .aev .etext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .aev .etitle {
    font-size: 12px; line-height: 15px; font-weight: 500; color: #171717;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .aev .etitle.fail { color: #C40C0C; }
  .aev .esub {
    font-size: 12px; line-height: 15px; color: rgba(86, 86, 86, 0.5);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .aev .eactions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
  .dbtn {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; padding: 0;
    cursor: pointer;
  }
  .dbtn.wand { border-radius: 999px; background: #171717; transition: transform 120ms ease; }
  .dbtn.wand:hover { transform: scale(1.08); }
  .dbtn.ghost { border-radius: 8px; background: #FFFFFF; border: 1px solid #D4D4D4; transition: background-color 120ms ease; }
  .dbtn.ghost:hover { background: #FAFAFA; }
  .afooter { display: flex; align-items: center; justify-content: space-between; }
  .dthumbs { display: flex; align-items: flex-start; gap: 8px; }
  .dthumbs svg { cursor: pointer; }
  .dthumbs svg:last-child { margin-top: 2px; }
  .dthumbs svg:hover path { stroke: #171717; }
  .btn-visualize {
    height: 24px; padding: 0 8px; border-radius: 6px;
    background: #FFFFFF; border: none; outline: 1px solid #E6E6E6;
    display: flex; align-items: center; gap: 6px;
    font-family: system-ui, sans-serif;
    font-size: 14px; line-height: 18px; font-weight: 600; color: #4D4D4D;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .btn-visualize:hover { background: #FAFAFA; }
</style>
</head>

    <div class="crumb">

        <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1.5" width="14" height="13" rx="2.5" fill="none" stroke="#666666"/>

    + '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><path d="M6 12.081L6.667 9.334H2.78a1.333 1.333 0 0 1-1.28-1.707l1.553-5.333A1.333 1.333 0 0 1 4.333 1.334H13.333a1.333 1.333 0 0 1 1.334 1.333v5.334a1.333 1.333 0 0 1-1.334 1.333h-1.84a1.333 1.333 0 0 0-1.193 0.74L8 14.667a2.087 2.087 0 0 1-2-2.586Z" fill="none" stroke="#6E6E74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.333 9.334V1.334" fill="none" stroke="#6E6E74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'

      + (ev.actions ? '<div class="eactions">' + ev.actions.join('') + '</div>' : '')
      + '</div></div></div>';
  }).join('');

  var detail = '<div class="adetail"><div class="adetail-clip"><div class="adetail-inner">'

  root.querySelectorAll('.arun').forEach(function (run) {

      run.classList.toggle('open');

})();
